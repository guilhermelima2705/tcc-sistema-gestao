<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Espaço Carmem Lúcia | Histórico Pessoal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../../base.css"/>
  <link rel="stylesheet" href="../listar-servicos/listar-servicos.css"/>
</head>
<body>
  <div class="overlay" id="overlay" onclick="fecharMenu()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../../img/logo.png" alt="Logo" class="sidebar-logo"/>
      <span class="sidebar-nome">Espaço Carmem Lúcia</span>
    </div>
    <ul class="sidebar-menu">
      <li><a href="../../index-home/home.html"><i class="fa-solid fa-house"></i> Início</a></li>
      <li><a href="../../agendamentos/agendamentos.html"><i class="fa-solid fa-calendar-days"></i> Agendamentos</a></li>
      <li><a href="../../clientes/clientes.html"><i class="fa-solid fa-users"></i> Clientes</a></li>
      <li><a href="../../funcionarios/funcionarios.html"><i class="fa-solid fa-id-badge"></i> Funcionários</a></li>
      <li><a href="../../servicos/servico.html"><i class="fa-solid fa-scissors"></i> Serviços</a></li>
      <li><a href="../financas.html" class="menu-ativo"><i class="fa-solid fa-chart-line"></i> Finanças</a></li>
    </ul>
  </nav>
  <main class="phone">
    <header class="topbar">
      <div class="topbar-logo">
        <a href="../../index-home/home.html"><img src="../../img/logo.png" alt="Logo CL"/></a>
      </div>
      <div class="topbar-right">
        <button class="btn-hamburguer" onclick="abrirMenu()" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="avatar-wrap" id="avatarWrap">
          <div class="avatar" id="avatar" onclick="togglePerfil(event)"></div>
          <div class="perfil-dropdown" id="perfilDropdown">
            <div class="perfil-info">
              <p class="perfil-nome" id="perfilNome"></p>
              <p class="perfil-email" id="perfilEmail"></p>
            </div>
            <a href="../../login/login.html" class="perfil-sair">
              <i class="fa-solid fa-right-from-bracket"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </header>
    <div class="tela-header">
      <button class="btn-voltar" onclick="history.back()" aria-label="Voltar">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h2 class="tela-titulo">Histórico Pessoal</h2>
    </div>
    <section class="filtros">
      <div class="filtro-periodo">
        <div class="filtro-data-wrap">
          <label class="filtro-label">De</label>
          <input type="date" id="dataInicio" class="select-periodo input-data" onchange="validarDatas()"/>
        </div>
        <div class="filtro-data-wrap">
          <label class="filtro-label">Até</label>
          <input type="date" id="dataFim" class="select-periodo input-data" onchange="validarDatas()"/>
        </div>
        <button class="btn-limpar-data" onclick="limparDatas()">Limpar</button>
      </div>
      <div class="filtro-tipo">
        <button class="ftbtn ativo" onclick="setTipo('todos', this)">Todos</button>
        <button class="ftbtn" onclick="setTipo('entrada', this)">Entradas</button>
        <button class="ftbtn" onclick="setTipo('saida', this)">Saídas</button>
      </div>
    </section>
    <!-- AVISO: aparece quando "De" > "Até" e some após 3 segundos -->
    <p id="avisoData" style="display:none;margin:0 16px 4px;padding:8px 14px;background:#fff3e0;border-left:3px solid var(--rose-gold-dark);border-radius:8px;font-family:'Jost',sans-serif;font-size:0.8rem;color:var(--rose-gold-dark);">⚠️ As datas foram trocadas automaticamente.</p>
    <section class="lista-wrap" id="listaTransacoes">
      <p class="lista-vazia">Nenhuma transação encontrada.</p>
    </section>
  </main>
  <script src="listar-pessoal.js"></script>
</body>
</html>
