<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Espaço Carmem Lúcia | Cadastro de Serviço</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="../base.css" />
  <link rel="stylesheet" href="cadastrar-servico.css" />
</head>
<body>

    <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../img/logo.png" alt="Logo" class="sidebar-logo" />
      <span class="sidebar-nome">Espaço Carmem Lúcia</span>
    </div>
    <ul class="sidebar-menu">
      <li><a href="../index-home/home.html"><i class="fa-solid fa-house"></i> Início</a></li>
      <li><a href="../agendamentos/agendamentos.html"><i class="fa-solid fa-calendar-days"></i> Agendamentos</a></li>
      <li><a href="../clientes/clientes.html"><i class="fa-solid fa-users"></i> Clientes</a></li>
      <li><a href="../funcionarios/funcionarios.html"><i class="fa-solid fa-id-badge"></i> Funcionários</a></li>
      <li><a href="servico.html" class="menu-ativo"><i class="fa-solid fa-scissors"></i> Serviços</a></li>
      <li><a href="../financas/financas.html"><i class="fa-solid fa-chart-line"></i> Finanças</a></li>
    </ul>
  </nav>

  <main class="phone">

        <header class="topbar">
      <div class="topbar-logo">
        <a href="../index-home/home.html"><img src="../img/logo.png" alt="Logo CL" /></a>
      </div>
      <div class="topbar-right">
        <button class="btn-hamburguer" onclick="abrirMenu()" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="avatar-wrap" id="avatarWrap">
          <div class="avatar" id="avatar" onclick="togglePerfil(event)"></div>
          <div class="perfil-dropdown" id="perfilDropdown">
            <div class="perfil-info">
              <p class="perfil-nome" id="perfilNome"></p>
              <p class="perfil-email" id="perfilEmail"></p>
            </div>
            <a href="../login/login.html" class="perfil-sair">
              <i class="fa-solid fa-right-from-bracket"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </header>

    <div class="tela-header">
      <button class="btn-voltar" onclick="history.back()" aria-label="Voltar">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h2 class="tela-titulo">Cadastro de Serviço</h2>
    </div>

    <section class="form-cadastro">

      <form id="formCadastro" name="cadastro_servico">
        <div class="field">
          <label for="nome">Nome do Serviço</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Corte, Escova, Manicure" required />
        </div>

        <div class="field">
          <label for="duracaoMinutos">Duração (em minutos)</label>
          <input type="number" id="duracaoMinutos" name="duracaoMinutos" placeholder="Ex: 30, 45, 60" min="1" required />
        </div>

        <div class="field">
          <label for="preco">Preço (R$)</label>
          <input type="text" id="preco" name="preco" placeholder="0,00" inputmode="numeric" oninput="formatarPreco(this)" required />
        </div>

        <div class="field">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" class="textarea-obs" placeholder="Descrição detalhada do serviço (opcional)"></textarea>
        </div>

        <div id="msgCadastro" class="msg"></div>

        <div class="form-btns">
          <button type="reset" class="btn-form-limpar"><i class="fa-solid fa-eraser"></i> Limpar</button>
          <button type="submit" class="btn-form-cadastrar"><i class="fa-solid fa-check"></i> Cadastrar</button>
        </div>
      </form>

    </section>

  </main>

  <div class="modal-overlay" id="modalSucesso">
    <div class="modal">
      <div class="modal-body" style="text-align:center; padding:32px 24px;">
        <i class="fa-solid fa-circle-check"
           style="font-size:2.5rem; color:var(--rose-gold); display:block; margin-bottom:12px;"></i>
        <h3 style="font-family:'Cormorant Garamond',serif; font-size:1.4rem; margin-bottom:8px;">
          Serviço Cadastrado!
        </h3>
        <p style="font-size:0.87rem; color:var(--text-soft); margin-bottom:24px;">
          O serviço foi cadastrado com sucesso.
        </p>
        <!-- Botão centralizado e com largura total -->
        <button type="button" class="btn-form-cadastrar"
                style="width:100%; justify-content:center; padding:14px;"
                onclick="fecharModal()">
          <i class="fa-solid fa-check"></i> Ok
        </button>
      </div>
    </div>
  </div>

  <script src="cadastrar-servico.js"></script>

</body>
</html>
