<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Espaço Carmem Lúcia | Histórico de Produtos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../base.css"/>
  <link rel="stylesheet" href="listar-produtos.css"/>
</head>
<body>
  <div class="overlay" id="overlay" onclick="fecharMenu()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../img/logo.png" alt="Logo" class="sidebar-logo"/>
      <span class="sidebar-nome">Espaço Carmem Lúcia</span>
    </div>
    <ul class="sidebar-menu">
      <li><a href="../index-home/home.html"><i class="fa-solid fa-house"></i> Início</a></li>
      <li><a href="../agendamentos/agendamentos.html"><i class="fa-solid fa-calendar-days"></i> Agendamentos</a></li>
      <li><a href="../clientes/clientes.html"><i class="fa-solid fa-users"></i> Clientes</a></li>
      <li><a href="../funcionarios/funcionarios.html"><i class="fa-solid fa-id-badge"></i> Funcionários</a></li>
      <li><a href="../servico/servico.html"><i class="fa-solid fa-scissors"></i> Serviços</a></li>
      <li><a href="../financas/financas.html" class="menu-ativo"><i class="fa-solid fa-chart-line"></i> Finanças</a></li>
    </ul>
  </nav>
  <main class="phone">
    <header class="topbar">
      <div class="topbar-logo">
        <a href="../index-home/home.html"><img src="../img/logo.png" alt="Logo CL"/></a>
      </div>
      <div class="topbar-right">
        <button class="btn-hamburguer" onclick="abrirMenu()" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="avatar-wrap" id="avatarWrap">
          <div class="avatar" id="avatar" onclick="togglePerfil(event)"></div>
          <div class="perfil-dropdown" id="perfilDropdown">
            <div class="perfil-info">
              <p class="perfil-nome" id="perfilNome"></p>
              <p class="perfil-email" id="perfilEmail"></p>
            </div>
            <a href="../login/login.html" class="perfil-sair">
              <i class="fa-solid fa-right-from-bracket"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </header>
    <div class="tela-header">
      <button class="btn-voltar" onclick="history.back()" aria-label="Voltar">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h2 class="tela-titulo">Histórico de Produtos</h2>
    </div>
    <section class="filtros">
      <div class="filtro-periodo">
        <select id="selectMes" class="select-periodo" onchange="mudouMes()">
          <option value="">Mês</option>
          <option value="01">Janeiro</option>
          <option value="02">Fevereiro</option>
          <option value="03">Março</option>
          <option value="04">Abril</option>
          <option value="05">Maio</option>
          <option value="06">Junho</option>
          <option value="07">Julho</option>
          <option value="08">Agosto</option>
          <option value="09">Setembro</option>
          <option value="10">Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>
        <select id="selectAno" class="select-periodo" style="display: none;" onchange="aplicar()">
          <option value="">Ano</option>
        </select>
      </div>
      <div class="filtro-tipo">
        <button class="ftbtn ativo" onclick="setTipo('todos', this)">Todos</button>
        <button class="ftbtn" onclick="setTipo('entrada', this)">Entradas</button>
        <button class="ftbtn" onclick="setTipo('saida', this)">Saídas</button>
      </div>
    </section>
    <button class="btn-exportar" onclick="exportarPDF()">
      <i class="fa-solid fa-file-arrow-down"></i> Exportar Extrato PDF
    </button>
    <section class="lista-wrap" id="listaTransacoes">
      <p class="lista-vazia">Nenhuma transação encontrada.</p>
    </section>
  </main>
  <script src="listar-produtos.js"></script>
</body>
</html>
