<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Espaço Carmem Lúcia | Novo Cliente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../base.css" />
  <link rel="stylesheet" href="novo-cliente.css" />
</head>
<body>

  <!-- overlay do menu lateral -->
  <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../img/logo.png" alt="Logo" class="sidebar-logo" />
      <span class="sidebar-nome">Espaço Carmem Lúcia</span>
    </div>
    <ul class="sidebar-menu">
      <li><a href="../index-home/home.html"><i class="fa-solid fa-house"></i> Início</a></li>
      <li><a href="../agendamentos/agendamentos.html"><i class="fa-solid fa-calendar-days"></i> Agendamentos</a></li>
      <li><a href="clientes.html" class="menu-ativo"><i class="fa-solid fa-users"></i> Clientes</a></li>
      <li><a href="../funcionarios/funcionarios.html"><i class="fa-solid fa-id-badge"></i> Funcionários</a></li>
      <li><a href="../servicos/servico.html"><i class="fa-solid fa-scissors"></i> Serviços</a></li>
      <li><a href="../financas/financas.html"><i class="fa-solid fa-chart-line"></i> Finanças</a></li>
    </ul>
  </nav>

  <main class="phone">

    <!-- topbar igual às outras telas -->
    <header class="topbar">
      <div class="topbar-logo">
        <a href="../index-home/home.html"><img src="../img/logo.png" alt="Logo CL" /></a>
      </div>
      <div class="topbar-right">
        <button class="btn-hamburguer" onclick="abrirMenu()" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="avatar-wrap" id="avatarWrap">
          <div class="avatar" id="avatar" onclick="togglePerfil(event)"></div>
          <div class="perfil-dropdown" id="perfilDropdown">
            <div class="perfil-info">
              <p class="perfil-nome" id="perfilNome"></p>
              <p class="perfil-email" id="perfilEmail"></p>
            </div>
            <a href="../login/login.html" class="perfil-sair">
              <i class="fa-solid fa-right-from-bracket"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- cabeçalho com botão voltar -->
    <div class="tela-header">
      <button class="btn-voltar" onclick="history.back()" aria-label="Voltar">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h2 class="tela-titulo">Cadastro de Clientes</h2>
    </div>

    <!-- formulário de cadastro -->
    <form id="formCadastro" class="form-cadastro">

      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Nome completo do cliente" />
      </div>

      <div class="field">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15"/>
      </div>

      <div class="field">
        <label for="data_nascimento">Data de Nascimento</label>
        <input type="date" id="data_nascimento" name="data_nascimento" required />
      </div>

      <div class="field">
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" name="observacoes" class="textarea-obs" placeholder="Ex: alergia a amônia, prefere horário manhã..."></textarea>
      </div>

      <div id="msgCadastro" class="msg"></div>

      <div class="form-btns">
        <button type="button" class="btn-form-limpar" onclick="limparFormulario()">
          <i class="fa-solid fa-eraser"></i> Limpar
        </button>
        <button type="submit" class="btn-form-cadastrar">
          <i class="fa-solid fa-check"></i> Cadastrar
        </button>
      </div>

    </form>

  </main>

  <!-- pop-up de sucesso -->
  <div class="modal-overlay" id="popupSucesso">
    <div class="modal popup-sucesso">

      <!-- ✕ Botão fechar no canto superior direito -->
      <button class="popup-fechar" onclick="fecharPopup()" aria-label="Fechar">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="popup-icone">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <p class="popup-titulo">Cliente cadastrado com sucesso!</p>
      <div class="popup-btns">
        <button class="btn-form-cadastrar" onclick="window.location.href='../agendamentos/agendamentos.html'">
          <i class="fa-solid fa-calendar-plus"></i> Novo Agendamento
        </button>
        <button class="btn-form-limpar" onclick="window.location.href='../index-home/home.html'">
          <i class="fa-solid fa-house"></i> Tela Inicial
        </button>
        <!-- Botão compartilhar — mesmo estilo dos outros, mas funcional -->
        <button type="button" class="btn-form-limpar" onclick="compartilharLink()">
          <i class="fa-solid fa-share-nodes"></i> Compartilhar link de agendamento
        </button>
      </div>
    </div>
  </div>

  <script src="novo-cliente.js"></script>
</body>
</html>
