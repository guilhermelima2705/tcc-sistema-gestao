<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />
  <title> Espaço Carmen Lúcia | Acesse sua conta </title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../base.css" />
  <link rel="stylesheet" href="login.css" />

</head>
<body>
  <main class="phone">
    <section class="banner">
      <div class="circle c1"></div>
      <div class="circle c2"></div>

      <div class="logo-wrap">
        <img src="../img/logo.png" alt="Logo Carmen Lúcia" />
        <span class="salon-name">
        <small>Espaço</small>
        Carmem Lúcia
        </span>
      </div>
    </section>
    
    <section class="card">
      <div class="card-header">
        <p class="eyebrow">Área interna</p>
        <h1>Bem-vindo(a)</h1>
        <p class="sub">Acesse sua conta</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="usuario">login</label>
          <input
            type="email"
            id="usuario"
            placeholder="Digite seu e-mail"
            autocomplete="username"
          />
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="pass-wrap">
            <input
              type="password"
              id="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-pass"
              aria-label="Mostrar ou ocultar senha"
              onclick="toggleSenha()"
            >
              <i class="fa-regular fa-eye" id="iconeOlho"></i>
            </button>
          </div>
        </div>

        <a href="recuperar-senha.html" class="forgot">Esqueceu a senha?</a>

        <button type="submit" class="btn-login">Entrar</button>

        <div id="msg" class="msg" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="login.js"></script>

</body>
</html>
