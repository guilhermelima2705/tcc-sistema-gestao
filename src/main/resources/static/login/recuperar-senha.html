<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Recuperar Senha | Espaço Carmem Lúcia</title>
  
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="login.css">
  <!-- Fonts — mesmo conjunto do login.html -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <!-- FontAwesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- novo-cliente.css REMOVIDO — não existe nesta pasta e quebrava o layout -->
</head>
<body>

  <main class="phone">
    <section class="banner">
      <div class="circle c1"></div>
      <div class="circle c2"></div>
      <div class="logo-wrap">
        <img src="../img/logo.png" alt="Logo">
        <span class="salon-name"><small>Espaço</small>Carmem Lúcia</span>
      </div>
    </section>

    <section class="card" id="cardRecuperar">
      <div class="card-header">
        <p class="eyebrow">Segurança</p>
        <h1>Esqueceu a senha?</h1>
        <p class="sub">Digite seu e-mail abaixo para iniciar o processo de redefinição.</p>
      </div>

      <form id="recuperarForm">
        <div class="field">
          <label for="emailRecupera">E-mail de Cadastro</label>
          <input type="email" id="emailRecupera" placeholder="exemplo@gmail.com" required>
        </div>

        <div class="form-btns">
          <button type="button" class="btn-form-limpar" onclick="window.location.href='login.html'">
            Voltar
          </button>
          <button type="submit" class="btn-form-cadastrar">
            Enviar Link
          </button>
         </div>
        
        <div id="msgRecupera" class="msg"></div>
      </form>
    </section>
  </main>

  <script src="recuperar.js"></script>
</body>
</html>
