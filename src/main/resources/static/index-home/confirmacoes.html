<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Espaço Carmem Lúcia | Confirmações de Véspera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght=0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="../funcionarios/funcionarios.css" />
</head>
<body>

<div class="overlay" id="overlay" onclick="fecharMenu()"></div>

<nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <img src="../img/logo.png" alt="Logo" class="sidebar-logo" />
        <span class="sidebar-nome">Espaço Carmem Lúcia</span>
    </div>
    <ul class="sidebar-menu">
        <li><a href="home.html"><i class="fa-solid fa-house"></i> Início</a></li>
        <li><a href="../agendamentos/agendamentos.html"><i class="fa-solid fa-calendar-days"></i> Agendamentos</a></li>
        <li><a href="confirmacoes.html" class="menu-ativo"><i class="fa-solid fa-bell"></i> Confirmações</a></li>
        <li><a href="../clientes/clientes.html"><i class="fa-solid fa-users"></i> Clientes</a></li>
        <li><a href="../funcionarios/funcionarios.html"><i class="fa-solid fa-id-badge"></i> Funcionários</a></li>
        <li><a href="../servicos/servico.html"><i class="fa-solid fa-scissors"></i> Serviços</a></li>
        <li><a href="../financas/financas.html"><i class="fa-solid fa-chart-line"></i> Finanças</a></li>
    </ul>
</nav>

<main class="phone">

    <header class="topbar">
        <div class="topbar-logo">
            <a href="home.html"><img src="../img/logo.png" alt="Logo CL" /></a>
        </div>
        <div class="topbar-right">
            <button class="btn-hamburguer" onclick="abrirMenu()" aria-label="Abrir menu">
                <span></span><span></span><span></span>
            </button>
            <div class="avatar-wrap" id="avatarWrap">
                <div class="avatar" id="avatar" onclick="togglePerfil(event)"></div>
                <div class="perfil-dropdown" id="perfilDropdown">
                    <div class="perfil-info">
                        <p class="perfil-nome" id="perfilNome"></p>
                        <p class="perfil-email" id="perfilEmail"></p>
                    </div>
                    <a href="../login/login.html" class="perfil-sair">
                        <i class="fa-solid fa-right-from-bracket"></i> Sair
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="tela-header">
        <button class="btn-voltar" onclick="history.back()" aria-label="Voltar">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div>
            <h2 class="tela-titulo">Confirmações de Véspera</h2>
            <p style="font-size: 0.85rem; color: var(--text-soft); margin-top: 4px;">Clientes agendados para amanhã</p>
        </div>
    </div>

    <section class="clientes-tabela-wrap" style="margin-top: 20px;">
        <table class="clientes-tabela">
            <thead>
            <tr>
                <th>Horário</th>
                <th>Cliente</th>
                <th>WhatsApp</th>
                <th>Serviço</th>
                <th>Profissional</th>
                <th style="text-align: center;">Ação</th>
            </tr>
            </thead>
            <tbody id="tabelaCorpo"></tbody>
        </table>
        <p class="tabela-vazia" id="tabelaVazia" style="display:none;">
            🎉 Ninguém agendado para amanhã ou todos os lembretes enviados!
        </p>
    </section>

</main>

<script src="confirmacoes.js"></script>
</body>
</html>
