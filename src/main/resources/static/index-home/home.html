<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Espaço Carmem Lúcia | Início</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../base.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>

    <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="../img/logo.png" alt="Logo" class="sidebar-logo" />
        <span class="sidebar-nome">Espaço Carmem Lúcia</span>
      </div>
      <ul class="sidebar-menu">
        <li><a href="home.html" class="menu-ativo"><i class="fa-solid fa-house"></i> Início</a></li>
        <li><a href="../agendamentos/agendamentos.html"><i class="fa-solid fa-calendar-days"></i> Agendamentos</a></li>

        <li><a href="confirmacoes.html"><i class="fa-solid fa-bell"></i> Confirmações</a></li>

        <li><a href="../clientes/clientes.html"><i class="fa-solid fa-users"></i> Clientes</a></li>
        <li><a href="../funcionarios/funcionarios.html"><i class="fa-solid fa-id-badge"></i> Funcionários</a></li>
        <li><a href="../servicos/servico.html"><i class="fa-solid fa-scissors"></i> Serviços</a></li>
        <li><a href="../financas/financas.html"><i class="fa-solid fa-chart-line"></i> Finanças</a></li>
      </ul>
    </nav>

  <main class="phone">

        <header class="topbar">
      <div class="topbar-logo">
        <a href="home.html"><img src="../img/logo.png" alt="Logo CL" /></a>
      </div>
      <div class="topbar-right">
        <button class="btn-hamburguer" onclick="abrirMenu()" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="avatar-wrap" id="avatarWrap">
          <div class="avatar" id="avatar" onclick="togglePerfil(event)"></div>
          <div class="perfil-dropdown" id="perfilDropdown">
            <div class="perfil-info">
              <p class="perfil-nome" id="perfilNome"></p>
              <p class="perfil-email" id="perfilEmail"></p>
            </div>
            <a href="../login/login.html" class="perfil-sair">
              <i class="fa-solid fa-right-from-bracket"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </header>

    <section class="saudacao">
      <h1>Espaço<br><span>Carmem Lúcia</span></h1>
      <p class="sub">Carregando...</p>
      <!-- Data e hora exibidas UMA VEZ, abaixo da saudação -->
      <p class="data-hora-home" id="dataHoje"></p>
    </section>

    <section class="cards-grid">

      <!-- card agendamentos do dia -->
      <div class="card-info">
        <div class="card-info-header">
          <i class="fa-solid fa-calendar-days card-icon"></i>
          <h2>Agendamentos do dia</h2>
        </div>
        <ul class="card-lista" id="listaHome"></ul>
        <a href="../agendamentos/agendamentos.html" class="card-link">Ver todos →</a>
      </div>

      <!-- card lucro do dia -->
      <div class="card-info">
        <div class="card-info-header">
          <i class="fa-solid fa-chart-line card-icon"></i>
          <h2>Lucro do dia</h2>
          <button class="btn-olho" id="btnOlho" onclick="toggleLucro()" aria-label="Mostrar ou ocultar lucro">
            <i class="fa-solid fa-eye-slash" id="iconOlho"></i>
          </button>
        </div>
        <!-- VALOR TOTAL GRANDE-->
        <p class="lucro-valor" id="lucroValor"></p>
        <!-- DETALHES CARMEM E ERIKA -->
        <ul class="card-lista" id="listaLucro"></ul>
        <!-- Link "Ver detalhes": visível apenas para a proprietária.
             O JS em home.js oculta este elemento para funcionários. -->
        <a href="../financas/financas.html" class="card-link" id="link-ver-detalhes">Ver detalhes →</a>
      </div>
    </section>
    <button class="btn-whats" title="Enviar agendamentos do dia">
    <svg viewBox="0 0 24 24" fill="currentColor">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
  </svg>
  </button>

  </main>

  <script src="home.js"></script>
</body>
</html>
