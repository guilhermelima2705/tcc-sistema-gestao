spring:
  mail:
    host: smtp.gmail.com
    port: 456
    username: "guilherme@gmail.com"
    password: ""
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

  application:
    name: ProjetoFinalSalaoCarmemLucia

  thymeleaf:
    check-template-location: false


  security:
    user:
      name: admin
      password: "123456"

  datasource:
    url: jdbc:mysql://localhost:3306/salao_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB


api:
  security:
    token:
      secret: "token-secreto"