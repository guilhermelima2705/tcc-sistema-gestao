spring:
  application:
    name: ProjetoFinalSalaoCarmemLucia

  thymeleaf:
    check-template-location: false

  security:
    user:
      name: ${APP_ADMIN_USER:admin}
      password: ${APP_ADMIN_PASSWORD:123456}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/salao_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

api:
  security:
    token:
      secret: ${JWT_SECRET:token-secreto-local}